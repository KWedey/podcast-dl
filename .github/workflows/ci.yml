name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # A new PR push supersedes the last; each push to main gets its own group, so none is cancelled.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, test, build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The engines floor in package.json, and the latest 22.x.
        node: ['22.12.0', '22']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      # The tests run src/ through tsx; this proves the published dist/ build works too.
      - name: Build and smoke-test the compiled CLI
        run: |
          npm run build
          node dist/cli.js --help
